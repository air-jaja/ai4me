# Contrôles automatiques, répartis sur deux moments.
#
#   avant chaque COMMIT : contrôles courts — style, catalogue, secrets, fichiers.
#   avant chaque PUSH   : la campagne de l'activité (tests courants + non-régression) ;
#                         la CI lance toujours la suite complète.
#
# Pourquoi cette séparation. Un commit doit rester rapide, sinon on cesse d'en
# faire. Les 288 tests prennent une dizaine de secondes : c'est trop pour chaque
# commit, et pas assez pour se permettre de pousser sans les avoir lancés.
#
# Le pre-commit ne lance donc PAS les tests. Un pre-commit vert ne dit rien de la
# suite — c'est le hook de pre-push qui s'en charge.
#
# Ce fichier n'est qu'une déclaration : Git exécute `.git/hooks/pre-commit` et
# `.git/hooks/pre-push`, que `make hooks` installe.
#
# Contourner les hooks (`--no-verify`) masque une dette, ce n'est pas une
# correction.

repos:
  # Ruff est exécuté via `uv run`, et non par un dépôt de hooks distant.
  # Motif : un hook distant embarque SA version de ruff, ici v0.6.9, quand le
  # verrou du projet en installe une autre. Deux linters différents finissent
  # par diverger — le hook reformate ce que la CI refuse, ou l'inverse. Passer
  # par `uv run` garantit une version unique, celle de `uv.lock`.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (linter, version du projet)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: ruff-format
        name: ruff (formatage, version du projet)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

      # Le catalogue des tests est généré : s'il n'est plus à jour, le dépôt
      # documente une suite qui n'est pas celle qu'il livre. Même contrôle que
      # la CI, exécuté avant que le commit ne parte.
      - id: catalogue-tests
        name: catalogue des tests à jour
        entry: uv run python tools/catalogue_tests.py
        language: system
        pass_filenames: false
        files: ^(tests/.*\.py|tools/catalogue_tests\.py)$

      # Le notebook de certification reste sans sorties jusqu'au gel (règle 3).
      # Exécuté dans Jupyter ou VS Code, il garde ses sorties : ce hook les retire
      # et fait échouer le commit, qu'il suffit de relancer après `git add`.
      - id: notebook-sans-sorties
        name: notebook de certification sans sorties
        entry: uv run jupyter nbconvert --clear-output --ClearMetadataPreprocessor.enabled=True --ClearMetadataPreprocessor.clear_notebook_metadata=False --inplace notebooks/cas_usage_churn_saas.ipynb
        language: system
        pass_filenames: false
        files: ^notebooks/cas_usage_churn_saas\.ipynb$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      # Empêche qu'un mot de passe de base ou une clé d'API parte dans
      # l'historique. Un secret commité y reste même après suppression du
      # fichier : le seul contrôle efficace est celui qui l'empêche d'y entrer.
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5000]

  # --- Avant le push : la suite de tests -------------------------------------
  - repo: local
    hooks:
      - id: tests
        name: campagne de l'activité (avant push)
        # Since phase 5: the current activity's tests, then its integration tests
        # (tests/campagnes.toml). The CI still runs the whole suite on every push.
        entry: uv run python tools/campagne_tests.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        # Volontairement au pre-push et non au pre-commit : dix secondes à chaque
        # commit finissent par décourager d'en faire, et un commit rare est un
        # commit gros, donc difficile à relire.
