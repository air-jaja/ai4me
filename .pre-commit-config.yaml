# Contrôles exécutés avant chaque commit.
# Déplacer la détection d'erreur au plus près du développeur réduit le coût de
# correction. Chaque hook doit être déterministe et identique à ce que fait la CI.
#
# Contourner les hooks (--no-verify) masque une dette, ce n'est pas une correction.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
      # ruff-format remplace black : un seul outil, une seule configuration,
      # une seule version à maintenir.
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      # Empêche qu'un mot de passe de base ou une clé d'API parte dans l'historique.
      # Un secret committé reste dans l'historique même après suppression du fichier.
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5000]
