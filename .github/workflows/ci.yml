# Chaîne d'intégration continue — étapes 1 et 2 décrites au notebook § 10.
# Objectif : aucun code de nettoyage ne part en production sans avoir été testé.
name: CI

on:
  push:
  pull_request:

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Installer Python
        run: uv python install

      - name: Synchroniser l'environnement depuis le verrou
        # --frozen : échoue si uv.lock n'est pas à jour avec pyproject.toml.
        # C'est le garde-fou de reproductibilité du dépôt.
        run: uv sync --frozen --group dev

      - name: Linter
        run: uv run ruff check .

      # Les hooks tournent aussi ici : un développeur peut ne pas les avoir installés,
      # ou les contourner avec --no-verify. Surtout, gitleaks ne s'exécute nulle part
      # ailleurs — sans cette étape, le scanner de secrets serait décoratif.
      - name: Contrôles pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Tests
        run: uv run pytest

      # The catalogue is generated from the test files. If it is out of date, the
      # repository documents a suite that no longer matches the one it ships.
      - name: Catalogue des tests à jour
        run: |
          uv run python tools/catalogue_tests.py --sortie /tmp/TESTS.md
          diff -q /tmp/TESTS.md docs/TESTS.md \
            || (echo '::error::docs/TESTS.md est obsolète — lancer make test-doc' && exit 1)

      # Rule 13: the register of what was left aside is generated from its source and from
      # the exclusions the code declares. Out of date, it lists decisions no longer made.
      - name: Registre des éléments écartés à jour
        run: |
          uv run python tools/registre_ecarts.py --sortie /tmp/REGISTRE.md
          diff -q /tmp/REGISTRE.md docs/05.REGISTRE_elements_ecartes.md \
            || (echo '::error::Registre obsolète — lancer make registre-doc' && exit 1)
