motif = "Diagnostic de l'arbitrage 3 : sans l'issue, les variables connues avant la décision expliquent 89,5 % de la variance de la valeur vie client ; l'issue n'ajoute rien (gain de R² nul, effet de +3 % à variables égales). L'écart de 18,9 contre 15,6 mois de revenu est un effet de composition : les comptes qui partent ont 6 mois d'ancienneté médiane, ceux qui restent 12. La valeur observée peut donc évaluer la règle."
