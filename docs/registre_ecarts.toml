# Registre des éléments laissés de côté — SOURCE (règle 13).
#
# Ce fichier est la seule source du registre. Le document lisible
# docs/05.REGISTRE_elements_ecartes.md en est GÉNÉRÉ par `make registre-doc` :
# ne jamais éditer le document, éditer ce fichier.
#
# Les colonnes exclues du modèle n'y figurent PAS : elles sont lues dans le code
# (MOTIFS_EXCLUSION, src/churn_saas/donnees/gold.py) et ajoutées par le générateur.
# Les recopier ici créerait deux versions qui finiraient par diverger (règle 7).
#
# Champs
#   id            E-xxx écarté · D-xx différé · A-xx à arbitrer (unique)
#   titre         ce qui est laissé de côté
#   nature        méthode | outil | variable | règle | action | architecture
#   statut        écarté (décision définitive) · différé (faute de temps)
#                 · à arbitrer (décision en attente du porteur)
#   phase         phase du projet où la décision a été prise
#   date          JJ/MM/AAAA si la décision est datée, sinon omis
#   competence    C1 à C9
#   section       section du notebook de certification où l'élément se défend
#   motif         la raison, chiffrée si possible
#   preuve        noms de tests (test_…) ou chemins de fichiers, séparés par « · »
#                 — vérifiés par tests/test_registre.py
#   source        document où la décision est consignée
#   condition     condition de réexamen — OBLIGATOIRE pour « différé » et « à arbitrer »
#   revirement    "oui" si l'élément avait d'abord été retenu (règle 9)

