# =============================================================================
#  docker-compose.yml — plateforme locale du projet churn SaaS
# -----------------------------------------------------------------------------
#  Cinq services, chacun rattaché à une compétence du référentiel :
#
#    api         service de scoring (C6)          -> port 8000
#    db          PostgreSQL, entrepôt des scores (C3, C7) -> port 5432
#    mlflow      suivi des expérimentations et registre de modèles (C5, C9) -> 5000
#    prometheus  collecte des indicateurs (C8, C9) -> port 9090
#    grafana     restitution des indicateurs (C8)  -> port 3000
#
#  Réseau interne : chaque service est joignable par son NOM. L'API contacte la
#  base via `db:5432`, Prometheus contacte l'API via `api:8000`. Aucune adresse IP.
#
#  Les secrets viennent du fichier .env (voir .env.example), jamais du YAML.
# =============================================================================

services:

  api:
    build: .
    image: churn-saas-api:${IMAGE_TAG:-v1.0}
    ports: ["8000:8000"]
    environment:
      CHURN_DB_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD:?renseigner DB_PASSWORD dans .env}@db:${DB_PORT:-5432}/${DB_NAME:-chrun}
      CHURN_MODEL_PATH: ${CHURN_MODEL_PATH:-/app/models/churn_model.joblib}
      MLFLOW_TRACKING_URI: http://mlflow:${MLFLOW_PORT:-5100}
    volumes:
      # Le modèle est monté, pas embarqué : un réentraînement ne force pas la
      # reconstruction de l'image (voir le commentaire du Dockerfile).
      - ./models:/app/models:ro
    depends_on:
      db:
        # `service_healthy` et non `service_started` : l'API ne doit pas tenter de
        # se connecter à une base qui n'accepte pas encore de connexions.
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports: ["${DB_PORT}:${DB_PORT}"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h localhost -p ${DB_PORT}"]
      interval: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.1
    ports: ["${MLFLOW_PORT}:${MLFLOW_PORT}"]
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg://$:${DB_PASSWORD :?renseigner DB_PASSWORD dans .env}@db:${DB_PORT:-5432}/${DB_NAME:-chrun}
    volumes: ["mlruns:/mlruns"]
    depends_on:
      db:
        condition: service_healthy
    # Le registre stocke ses métadonnées dans PostgreSQL et ses artefacts dans un
    # volume : les deux ont des cycles de vie différents (notebook § 3).
    command: >
      mlflow server
      --host 0.0.0.0 --port ${MLFLOW_PORT}
      --backend-store-uri postgresql+psycopg://${DB_USER:-chrun}:${DB_PASSWORD:?renseigner DB_PASSWORD dans .env}@db:${DB_PORT:-5432}/${DB_NAME:-chrun}
      --default-artifact-root /mlruns

  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["${PROMETHEUS_PORT}:${PROMETHEUS_PORT}"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    extra_hosts:
      # Permet à Prometheus de joindre un exporteur lancé sur l'hôte (port 9109),
      # utile quand le lot mensuel tourne hors conteneur pendant le développement.
      - "host.docker.internal:host-gateway"
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["${GRAFANA_PORT}:${GRAFANA_PORT}"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]

volumes:
  pgdata: {}
  mlruns: {}
