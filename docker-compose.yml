# =============================================================================
#  docker-compose.yml — plateforme locale du projet churn SaaS
# -----------------------------------------------------------------------------
#  Cinq services, chacun rattaché à une compétence du référentiel :
#
#    api         service de scoring (C6)          -> port 8000
#    db          PostgreSQL, entrepôt des scores (C3, C7) -> port 5432
#    mlflow      suivi des expérimentations et registre de modèles (C5, C9) -> 5000
#
#  Ports : seul le côté POSTE (gauche) est réglable par .env. Dans son conteneur,
#  chaque serveur écoute sur un port fixe ; les services se joignent par ce port.
#    prometheus  collecte des indicateurs (C8, C9) -> port 9090
#    grafana     restitution des indicateurs (C8)  -> port 3000
#
#  Réseau interne : chaque service est joignable par son NOM. L'API contacte la
#  base via `db:5432`, Prometheus contacte l'API via `api:8000`. Aucune adresse IP.
#
#  Les secrets viennent du fichier .env (voir .env.example), jamais du YAML.
# =============================================================================

services:

  api:
    build: .
    image: churn-saas-api:${IMAGE_TAG:-v1.0}
    ports: ["8000:8000"]
    environment:
      # `db:5432` : nom de service et port interne. PostgreSQL écoute toujours sur
      # 5432 dans le conteneur, quel que soit le port publié sur le poste.
      CHURN_DB_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      # Secret: from .env only. Without it, /score answers 503 (the API fails closed).
      CHURN_API_KEY: ${CHURN_API_KEY}
      # The champion is loaded by alias (file hash checked), with the catalogue (D-02).
      CHURN_ALIASES: /app/resultats/aliases_modeles.json
      CHURN_MODELES: /app/models
      CHURN_CATALOGUE: /app/data/raw/catalogue_plans.csv
      CHURN_DONNEES: /app/data/raw/churn_saas_complet.csv
      # Port interne du serveur MLflow, fixe : MLFLOW_PORT ne règle que le port publié.
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      # Le modèle est monté, pas embarqué : un réentraînement ne force pas la
      # reconstruction de l'image (voir le commentaire du Dockerfile).
      - ./models:/app/models:ro
      - ./resultats:/app/resultats:ro
      - ./data/raw:/app/data/raw:ro
    depends_on:
      db:
        # `service_healthy` et non `service_started` : l'API ne doit pas tenter de
        # se connecter à une base qui n'accepte pas encore de connexions.
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # Seul le port publié est ajustable : à changer si un autre PostgreSQL occupe
    # déjà 5432 sur le poste. Les services de la pile ne sont pas concernés.
    ports: ["${DB_PORT_HOTE:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h localhost -p 5432"]
      interval: 5s
      retries: 10
      # First start: PostgreSQL creates its database, stops, then restarts - about 40 s on
      # the development laptop (Docker Desktop, WSL2). Without this grace period the 25 s of
      # checks ran out first, `db` was declared unhealthy and `mlflow` refused to start.
      start_period: 60s

  mlflow:
    # Image construite localement : l'image officielle ne contient aucun pilote
    # PostgreSQL, et le serveur échoue au démarrage sur `No module named 'psycopg'`.
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    image: churn-saas-mlflow:${IMAGE_TAG:-v1.0}
    ports: ["${MLFLOW_PORT:-5000}:5000"]
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    volumes: ["mlruns:/mlruns"]
    depends_on:
      db:
        condition: service_healthy
    # Le registre stocke ses métadonnées dans PostgreSQL et ses artefacts dans un
    # volume : les deux ont des cycles de vie différents (notebook § 3).
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      --default-artifact-root /mlruns

  prometheus:
    image: prom/prometheus:v2.53.0
    # Prometheus écoute sur 9090 dans son conteneur : seul le port publié est réglable.
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    extra_hosts:
      # Permet à Prometheus de joindre un exporteur lancé sur l'hôte (port 9109),
      # utile quand le lot mensuel tourne hors conteneur pendant le développement.
      - "host.docker.internal:host-gateway"
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.1.0
    # Grafana écoute sur 3000 dans son conteneur : seul le port publié est réglable.
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]

volumes:
  pgdata: {}
  mlruns: {}
